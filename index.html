<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173d4c" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>장편 원고 편집실</title>
  <style>
    :root{--bg:#f5f7f9;--panel:#fff;--ink:#17242b;--muted:#6b7880;--line:#d9e1e5;--key:#173d4c;--soft:#eaf1f4;--warn:#8a4d00;--bad:#9f2424;--ok:#25643b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}header{position:sticky;top:0;z-index:5;background:rgba(245,247,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}h1{margin:0;font-size:22px}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:1180px;margin:0 auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tabs button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:700;white-space:nowrap}.tabs button.active,.btn.primary{background:var(--key);color:#fff;border-color:var(--key)}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:900px){.grid.two{grid-template-columns:1.15fr .85fr}.grid.three{grid-template-columns:repeat(3,1fr)}}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}label{display:block;font-weight:800;margin:8px 0 5px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}.manu{min-height:50vh}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 9px;margin:3px 4px 3px 0;font-size:13px}.finding{border-left:5px solid var(--line);padding:10px 12px;margin:9px 0;background:#fff;border-radius:12px}.finding.bad{border-color:var(--bad)}.finding.warn{border-color:var(--warn)}.finding.ok{border-color:var(--ok)}.small{font-size:13px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:12px}.hidden{display:none}.check{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.check input{width:auto;margin-top:6px}.split{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:720px){.split{grid-template-columns:1fr 1fr}}.danger{color:var(--bad)}.good{color:var(--ok)}button{cursor:pointer}button:active{transform:translateY(1px)}.footer{padding:18px;color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
<header><h1>장편 원고 편집실</h1><p class="sub">원고는 이 브라우저에만 저장됩니다. 서버 전송·AI API 호출·자동 수정 없음.</p></header>
<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>
</div>
<div class="footer">GitHub Pages용 간단 배포판 · 실제 원고와 백업 JSON은 저장소에 올리지 마세요.</div>
<script>
const KEY='writing-studio-v1';
const tabs=['원고 넣기','설정집','오류 검수','반복 표현','맥락 검색','프롬프트','백업'];
const defaultCards=[
 {id:'a',type:'인물',title:'인물 A',aliases:['주인공'],keywords:['감정선','말투','내면','거리감'],body:'주요 인물의 나이, 직업, 말투, 금지선, 관계 변화를 적어 둔다.'},
 {id:'b',type:'인물',title:'인물 B',aliases:['상대 인물'],keywords:['호칭','관계 변화','거리감'],body:'상대 인물의 말투, 다가가는 방식, 공적/사적 관계 규칙을 적어 둔다.'},
 {id:'place',type:'장소',title:'장소 카드',aliases:['주요 배경'],keywords:['공간감','분위기','이동'],body:'장소의 감각, 인물이 받는 압박, 관계 변화가 생기는 지점을 적는다.'},
 {id:'rule',type:'규칙',title:'호칭/관계 규칙',aliases:['호칭 규칙'],keywords:['호칭','공적 관계','사적 관계','환자','직장'],body:'장소나 관계 단계에 따라 달라지는 호칭, 선 넘음, 거리감을 적는다.'},
 {id:'style',type:'문체',title:'문체 주의 표현',aliases:['AI티'],keywords:['이상하게','어쩐지','묘하게','선명하게','오래 남았다','마음 한구석','숨이 막혔다'],body:'반복되면 감정 설명 과다처럼 보일 수 있는 표현을 확인한다.'}
];
const defaultRules='이전이름=>현재 이름으로 수정 필요=>필수 수정\n고등학생=>현재 설정과 맞는지 확인=>확인 필요\n죄송합니다=>과잉 사과인지 확인=>확인 필요';
const defaultCaution='이상하게,어쩐지,묘하게,선명하게,오래 남았다,마음 한구석,가슴 한구석,숨이 막혔다,알 수 없는 감정,설명할 수 없는,자신도 모르게,반사적으로,기분이 들었다,것 같았다,시선을 피했다,고개를 돌렸다,입술을 깨물었다,손끝이 떨렸다,목구멍이 막혔다,어깨가 굳었다,눈에 밟혔다,말문이 막혔다,심장이 덜컥 내려앉았다';
const defaultRepeat='습기/눅눅/축축\n숨/호흡/숨이 막\n괜찮\n시선/고개/눈을 피\n손끝/손가락/주먹/입술/어깨\n침묵/정적\n이상/묘하/낯설\n뜨겁/열기/달아오\n혼자/외로/돌아갈 곳\n미안/죄송/사과\n웃음/미소/입꼬리\n핸드폰/휴대폰/화면/메시지';
let state=load();let currentTab=0;let findings=[];let repeats=[];let hits=[];let selected=new Set();
function load(){try{return Object.assign({title:'',manuscript:'',before:'',after:'',settings:'',rules:defaultRules,caution:defaultCaution,repeat:defaultRepeat,cards:defaultCards,updated:''},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {title:'',manuscript:'',before:'',after:'',settings:'',rules:defaultRules,caution:defaultCaution,repeat:defaultRepeat,cards:defaultCards,updated:''}}}
function save(){state.updated=new Date().toLocaleString();localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'')}
function rx(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function linesOf(text,term){const out=[];if(!term.trim())return out;const re=new RegExp(rx(term.trim()),'g');const lines=text.split('\n');let pos=0;for(let i=0;i<lines.length;i++){let m;while((m=re.exec(lines[i]))){out.push({line:i+1,term,quote:lines[i].slice(Math.max(0,m.index-45),m.index+term.length+70),start:pos+m.index})}pos+=lines[i].length+1}return out}
function parseRules(){return state.rules.split('\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>{const [term,msg,severity]=line.split('=>').map(x=>(x||'').trim());return {id:i,term,msg:msg||'등록한 규칙과 대조하세요.',severity:severity||'확인 필요'}})}
function words(csv){return csv.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean)}
function analyze(){findings=[];const text=state.manuscript||'';for(const r of parseRules()){for(const h of linesOf(text,r.term)){findings.push({title:'설정 대조 · '+r.term,detail:r.msg,severity:r.severity,line:h.line,quote:h.quote})}}
 const caution=words(state.caution);for(const w of caution){const hs=linesOf(text,w);if(hs.length>=3)findings.push({title:'주의어 반복 · '+w,detail:hs.length+'회 발견. 무조건 삭제가 아니라 몰린 위치만 확인하세요.',severity:'선택 수정',line:hs[0].line,quote:hs[0].quote})}
 const bad=['자동으로 고쳐줘','전체 윤문','완전히 다시 써','리디 스타일로 바꿔'];for(const w of bad){for(const h of linesOf(text,w)){findings.push({title:'작업 방식 확인 · '+w,detail:'이 앱은 자동 수정이 아니라 검수와 후보 제안 중심입니다.',severity:'확인 필요',line:h.line,quote:h.quote})}}
 currentTab=2;render();}
function repeatCheck(){repeats=[];const text=state.manuscript||'';for(const line of state.repeat.split('\n').map(x=>x.trim()).filter(Boolean)){const terms=line.split('/').map(x=>x.trim()).filter(Boolean);let count=0,examples=[];for(const t of terms){const hs=linesOf(text,t);count+=hs.length;examples.push(...hs.slice(0,3));}repeats.push({name:line,count,examples:examples.slice(0,5)})}repeats.sort((a,b)=>b.count-a.count);currentTab=3;render();}
function searchContext(){hits=[];const q=state.manuscript;const nq=norm(q);for(const c of state.cards){let score=0,reason=[];const names=[c.title,...(c.aliases||[])];if(names.some(x=>norm(x)&&nq.includes(norm(x)))){score+=5;reason.push('제목/별칭')}for(const k of c.keywords||[]){if(norm(k)&&nq.includes(norm(k))){score+=3;reason.push(k)}}for(const token of String(c.body||'').match(/[가-힣A-Za-z0-9]{2,}/g)||[]){if(reason.length>8)break;if(norm(token)&&nq.includes(norm(token))){score+=1;reason.push(token)}}if(score>0)hits.push({card:c,score,reason:[...new Set(reason)]})}hits.sort((a,b)=>b.score-a.score);selected=new Set(hits.slice(0,8).map(h=>h.card.id));currentTab=4;render();}
function promptText(){const chosen=hits.filter(h=>selected.has(h.card.id));return `[작업 기준]\n자동 윤문 금지. 전체 재작성 금지. 원문 톤 유지. AI티 나는 감정 보강 금지. 문제 진단과 보강 후보만 제시.\n\n[비공개 설정 메모]\n${state.settings||'(입력된 설정 없음)'}\n\n[관련 설정 카드]\n${chosen.map(h=>`- ${h.card.type} · ${h.card.title} / 점수 ${h.score}\n  ${h.card.body}`).join('\n')||'(맥락 검색 결과 없음)'}\n\n[앞 장면]\n${state.before||'(없음)'}\n\n[현재 원고]\n${state.manuscript||'(없음)'}\n\n[다음 장면]\n${state.after||'(없음)'}\n\n[요청]\n1. 장면 핵심\n2. 앞뒤 연결성\n3. 감정선\n4. 캐릭터 톤 이탈\n5. AI티/반복 표현\n6. 장면 끝맛\n7. 맛 보강 후보 2~3개\n8. 건드리지 않아도 되는 부분`;}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('복사했어')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('복사했어')})}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function reportText(){return `# 검수 리포트\n\n## 오류/주의\n${findings.map(f=>`- [${f.severity}] ${f.title} / ${f.line}행\n  ${f.detail}\n  > ${f.quote}`).join('\n')||'없음'}\n\n## 반복 표현\n${repeats.map(r=>`- ${r.name}: ${r.count}회`).join('\n')||'아직 검사 안 함'}\n\n## 맥락 검색\n${hits.map(h=>`- ${h.card.type} · ${h.card.title}: ${h.score}점 (${h.reason.join(', ')})`).join('\n')||'아직 검색 안 함'}`}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map((t,i)=>`<button class="${i===currentTab?'active':''}" onclick="currentTab=${i};render()">${t}</button>`).join('')}
function render(){renderTabs();const app=document.getElementById('app');
 if(currentTab===0)app.innerHTML=`<div class="grid two"><section class="card"><label>장면 제목</label><input id="title" value="${esc(state.title)}" placeholder="예: 1권 3장 / 회식 장면"><label>현재 원고</label><textarea class="manu" id="manuscript" placeholder="여기에 원고를 붙여넣어">${esc(state.manuscript)}</textarea><div class="row"><button class="btn primary" onclick="saveFromInputs();analyze()">원고 검수하기</button><button class="btn" onclick="saveFromInputs();repeatCheck()">반복 표현 보기</button><button class="btn" onclick="saveFromInputs();searchContext()">맥락 검색</button></div><p class="small">${state.manuscript.length.toLocaleString()}자 · 마지막 저장 ${esc(state.updated||'아직 없음')}</p></section><section class="card"><label>앞 장면 요약 또는 끝부분</label><textarea id="before">${esc(state.before)}</textarea><label>다음 장면 메모</label><textarea id="after">${esc(state.after)}</textarea><button class="btn" onclick="saveFromInputs();copyText(promptText())">ChatGPT 요청문 복사</button></section></div>`;
 if(currentTab===1)app.innerHTML=`<div class="grid two"><section class="card"><label>비공개 설정 메모</label><textarea id="settings" placeholder="작품 설정, 인물 규칙, 금지선 등을 여기에 붙여넣어. 이 내용은 네 브라우저에만 저장돼.">${esc(state.settings)}</textarea><label>대조 규칙: 찾을말=>안내=>심각도</label><textarea id="rules">${esc(state.rules)}</textarea><label>주의어 목록: 쉼표 또는 줄바꿈</label><textarea id="caution">${esc(state.caution)}</textarea><label>반복 표현 묶음: 한 줄에 / 로 묶기</label><textarea id="repeat">${esc(state.repeat)}</textarea><button class="btn primary" onclick="saveFromInputs();alert('저장했어')">설정 저장</button></section><section class="card"><label>맥락 카드 JSON</label><textarea id="cards" style="min-height:520px">${esc(JSON.stringify(state.cards,null,2))}</textarea><p class="small">공개 저장소에는 실제 설정을 올리지 말고, 여기 브라우저 안에서만 입력해서 써.</p><button class="btn" onclick="saveFromInputs();alert('카드 저장했어')">카드 저장</button></section></div>`;
 if(currentTab===2)app.innerHTML=`<section class="card"><div class="row"><button class="btn primary" onclick="saveFromInputs();analyze()">다시 검사</button><button class="btn" onclick="copyText(reportText())">리포트 복사</button><button class="btn" onclick="download('검수리포트.md',reportText())">MD 다운로드</button></div><h2>오류/주의 결과</h2>${findings.length?findings.map(f=>`<div class="finding ${f.severity.includes('필수')?'bad':f.severity.includes('유지')?'ok':'warn'}"><b>[${esc(f.severity)}] ${esc(f.title)}</b><div>${esc(f.detail)}</div><p class="small">${f.line}행 · ${esc(f.quote)}</p></div>`).join(''):'<p class="small">아직 검사 결과가 없어. 원고 검수하기를 눌러줘.</p>'}</section>`;
 if(currentTab===3)app.innerHTML=`<section class="card"><div class="row"><button class="btn primary" onclick="saveFromInputs();repeatCheck()">반복 다시 계산</button><button class="btn" onclick="copyText(reportText())">리포트 복사</button></div><h2>반복 표현</h2>${repeats.length?repeats.map(r=>`<div class="finding ${r.count>=6?'warn':''}"><b>${esc(r.name)}: ${r.count}회</b>${r.examples.map(e=>`<p class="small">${e.line}행 · ${esc(e.quote)}</p>`).join('')}</div>`).join(''):'<p class="small">반복 표현 보기를 눌러줘.</p>'}</section>`;
 if(currentTab===4)app.innerHTML=`<section class="card"><div class="row"><button class="btn primary" onclick="saveFromInputs();searchContext()">맥락 검색 실행</button><button class="btn" onclick="currentTab=5;render()">프롬프트 보기</button></div><p class="small">원고에 나온 단어를 기준으로 관련 카드를 찾는 RAG-lite 방식이야. 의미 분석이나 AI 호출은 하지 않아.</p>${hits.length?hits.map(h=>`<div class="finding"><label class="check"><input type="checkbox" ${selected.has(h.card.id)?'checked':''} onchange="this.checked?selected.add('${h.card.id}'):selected.delete('${h.card.id}')"><span><b>${esc(h.card.type)} · ${esc(h.card.title)} · ${h.score}점</b><br><span class="small">매칭: ${esc(h.reason.join(', '))}</span><br>${esc(h.card.body)}</span></label></div>`).join(''):'<p class="small">아직 검색 결과가 없어.</p>'}</section>`;
 if(currentTab===5){const p=promptText();app.innerHTML=`<section class="card"><div class="row"><button class="btn primary" onclick="copyText(document.getElementById('prompt').value)">프롬프트 복사</button><button class="btn" onclick="download('chatgpt-요청문.txt',document.getElementById('prompt').value)">TXT 다운로드</button></div><label>ChatGPT에 붙여넣을 요청문</label><textarea id="prompt" style="min-height:65vh">${esc(p)}</textarea></section>`}
 if(currentTab===6)app.innerHTML=`<div class="grid two"><section class="card"><h2>백업</h2><p class="small">기기 변경 전에는 반드시 전체 JSON 백업을 내려받아 구글드라이브 같은 개인 공간에 보관해.</p><button class="btn primary" onclick="saveFromInputs();download('writing-studio-backup.json',JSON.stringify(state,null,2),'application/json')">전체 JSON 백업 다운로드</button><label>백업 JSON 복원</label><input type="file" id="import" accept="application/json"><button class="btn" onclick="importBackup()">복원</button></section><section class="card"><h2>주의</h2><p>GitHub 저장소에는 실제 원고를 올리지 마. 이 앱에 붙여넣은 내용은 이 브라우저의 localStorage에 저장돼.</p><p class="small">브라우저 데이터 삭제, 시크릿 모드, 다른 기기 접속 시 원고가 보이지 않을 수 있어. 백업 파일로 옮겨야 해.</p></section></div>`;
 bindInputs();}
function bindInputs(){['title','manuscript','before','after','settings','rules','caution','repeat','cards'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>saveFromInputs(false));});}
function saveFromInputs(parse=true){for(const id of ['title','manuscript','before','after','settings','rules','caution','repeat']){const el=document.getElementById(id);if(el)state[id]=el.value}const c=document.getElementById('cards');if(c&&parse){try{const v=JSON.parse(c.value);if(Array.isArray(v))state.cards=v;else alert('카드 JSON은 배열이어야 해')}catch(e){alert('카드 JSON 형식이 틀렸어. 저장 전 확인해줘.')}}save();}
function importBackup(){const f=document.getElementById('import').files[0];if(!f)return alert('파일을 골라줘');const r=new FileReader();r.onload=()=>{try{state=Object.assign(state,JSON.parse(r.result));save();alert('복원했어');currentTab=0;render();}catch(e){alert('JSON을 읽지 못했어')}};r.readAsText(f)}
window.addEventListener('beforeunload',()=>saveFromInputs(false));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
